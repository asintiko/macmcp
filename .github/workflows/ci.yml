name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # macOS-only behaviour (Seatbelt sandbox, screen capture, input injection, Accessibility)
  # can only be exercised on a real Mac, so the same suite runs on hosted macOS runners.
  macos:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Environment
        run: |
          sw_vers
          uname -m
          swiftc --version
          node --version
      - run: npm ci
      - run: npm run build
      # Compiled again by the tests through the product's own build step; done here first so that
      # compiler diagnostics appear in full.
      - name: Compile the desktop helper
        run: swiftc -swift-version 5 -module-name mcpclaude_helper -o "$RUNNER_TEMP/mcpclaude-helper" native/helper/*.swift
      - run: npm test
        env:
          # Screenshots of every Computer Use step, kept as a build artifact.
          MCPCLAUDE_TEST_ARTIFACTS: ${{ runner.temp }}/computer-use
      - name: Keep the Computer Use screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: computer-use-${{ matrix.os }}
          path: ${{ runner.temp }}/computer-use
          if-no-files-found: ignore
          retention-days: 14
      - name: Sandbox denials (diagnostics)
        if: failure()
        run: |
          log show --last 6m --style compact --predicate 'sender == "Sandbox"' 2>/dev/null | grep -i "deny" | sed -E 's/^.*Sandbox: //' | sort | uniq -c | sort -rn | head -80 || true
