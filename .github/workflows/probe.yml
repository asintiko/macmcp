# Temporary: answers what the hosted macOS runners can do (virtual displays, revoked privacy
# permissions). Deleted again once the answers are in docs/development/PROGRESS.md.
name: Probe

on:
  push:
    paths:
      - 'tests/macos/probe.sh'
      - 'tests/helpers/native/**'
      - '.github/workflows/probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/macos/probe.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/probe/*.png
            ${{ runner.temp }}/probe/*.jsonl
            ${{ runner.temp }}/probe/*.json
          if-no-files-found: ignore
          retention-days: 3
